name: Deploy Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Export web
        env:
          EXPO_PUBLIC_SUPABASE_URL: 'https://fgrvexkhluhlxgxfqgmn.supabase.co'
          EXPO_PUBLIC_SUPABASE_ANON_KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZncnZleGtobHVobHhneGZxZ21uIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIwODMyMzYsImV4cCI6MjEwNzY1OTIzNn0.nJhLPbu53wQaxbkLoxZREMVKWxwvHZqma5lmmqX8Tkg'
        run: pnpm --filter @nama/app run export:web

      - name: Deploy to Cloudflare Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler deploy
